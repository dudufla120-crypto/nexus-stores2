<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Nexus Stores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span>Nexus Stores</span></div>
        <ul class="nav-links">
            <li><a href="index.html">← Voltar</a></li>
            <li><a href="" id="logoutBtn">Sair</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Finalizar Compra</h1>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px;" id="checkoutLayout">
            <div class="card" id="produtoInfo">
                <p style="color:var(--text-secondary);">⏳ Carregando...</p>
            </div>
            <div class="card" id="pagamentoInfo">
                <p style="color:var(--text-secondary);">⏳ Carregando...</p>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase-app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
            "firebase-auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
            "firebase-firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDoc, doc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { gerarPixPayload, gerarQRCode, finalizarCompra } from './js/checkout.js';
        import { getPixConfig } from './js/admin.js';
        import { getCurrentUserData } from './js/auth.js';
        import { formatarPreco, mostrarNotificacao, mostrarModal, imagemParaBase64 } from './js/helper.js';

        const params = new URLSearchParams(window.location.search);
        const produtoId = params.get('produtoId');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }

            if (!produtoId) {
                document.getElementById('produtoInfo').innerHTML = '<p style="color:var(--red);">Produto não encontrado! <a href="index.html">Voltar</a></p>';
                document.getElementById('pagamentoInfo').innerHTML = '';
                return;
            }

            try {
                const prodSnap = await getDoc(doc(db, "produtos", produtoId));
                if (!prodSnap.exists()) {
                    document.getElementById('produtoInfo').innerHTML = '<p style="color:var(--red);">Produto não encontrado! <a href="index.html">Voltar</a></p>';
                    document.getElementById('pagamentoInfo').innerHTML = '';
                    return;
                }

                const produto = { id: prodSnap.id, ...prodSnap.data() };
                const configPix = await getPixConfig();
                const userData = await getCurrentUserData();
                const preco = parseFloat(produto.preco);

                const imgHtml = produto.imagemBase64
                    ? `<img src="${produto.imagemBase64}" style="width:100%;height:200px;object-fit:cover;border-radius:8px;">`
                    : '<div style="width:100%;height:200px;background:var(--bg-secondary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:60px;">🎮</div>';

                document.getElementById('produtoInfo').innerHTML = `
                    <h2 style="color:var(--accent);margin-bottom:16px;">Resumo do Pedido</h2>
                    ${imgHtml}
                    <div style="padding:16px 0;">
                        <h3>${produto.nome}</h3>
                        <p style="color:#666;">${produto.descricao || 'Produto digital'}</p>
                        <div class="product-price">${formatarPreco(preco)}</div>
                    </div>
                `;

                if (!configPix.chavePix) {
                    document.getElementById('pagamentoInfo').innerHTML = `
                        <h2 style="color:var(--yellow);margin-bottom:16px;">Pagamento Indisponível</h2>
                        <p style="color:#666;">O admin ainda não configurou a chave PIX.</p>
                        <a href="index.html" class="btn btn-secondary" style="margin-top:16px;">Voltar</a>
                    `;
                    return;
                }

                const pixPayload = gerarPixPayload(configPix.chavePix, configPix.nomePix, 'Sao Paulo', preco);

                document.getElementById('pagamentoInfo').innerHTML = `
                    <h2 style="color:var(--accent);margin-bottom:16px;">Pagamento via PIX</h2>
                    <p style="color:#666;margin-bottom:16px;">Escaneie o QR Code com seu banco</p>
                    <div style="text-align:center;margin:20px 0;" id="qrcodeContainer">
                        <div id="qrcode"></div>
                    </div>
                    <div style="background:#0a0a0a;padding:12px;border-radius:8px;margin:16px 0;">
                        <p style="font-size:12px;color:#666;margin-bottom:4px;">Chave PIX:</p>
                        <p style="font-weight:600;word-break:break-all;" id="chavePixDisplay">${configPix.chavePix}</p>
                    </div>
                    <button class="btn btn-secondary btn-small" onclick="copiarChave()" style="margin-bottom:16px;">📋 Copiar Chave PIX</button>
                    <div style="background:rgba(139,92,246,0.1);padding:16px;border-radius:8px;margin:16px 0;">
                        <p style="color:var(--accent);font-weight:600;margin-bottom:8px;">💡 Após pagar:</p>
                        <p style="color:#666;font-size:14px;">
                            1. Pague com QR Code ou copie a chave<br>
                            2. Tire print do comprovante<br>
                            3. Faça upload abaixo
                        </p>
                    </div>
                    <div class="form-group">
                        <label>Comprovante (foto/print do pagamento)</label>
                        <input type="file" class="form-input" id="comprovanteInput" accept="image/*">
                        <div id="previewComprovante" style="margin-top:8px;"></div>
                    </div>
                    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="confirmarBtn">✓ Já paguei - Confirmar Compra</button>
                    <div id="checkoutStatus" style="margin-top:12px;"></div>
                `;

                gerarQRCode(pixPayload, 'qrcode');

                window.copiarChave = () => {
                    navigator.clipboard.writeText(configPix.chavePix)
                        .then(() => mostrarNotificacao('Chave PIX copiada!', 'sucesso'))
                        .catch(() => mostrarNotificacao('Copie manualmente: ' + configPix.chavePix, 'info'));
                };

                document.getElementById('comprovanteInput').addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        const r = new FileReader();
                        r.onload = (ev) => {
                            document.getElementById('previewComprovante').innerHTML = `<img src="${ev.target.result}" style="max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--border);">`;
                        };
                        r.readAsDataURL(e.target.files[0]);
                    }
                });

                document.getElementById('confirmarBtn').addEventListener('click', async () => {
                    const btn = document.getElementById('confirmarBtn');
                    const status = document.getElementById('checkoutStatus');
                    const fileInput = document.getElementById('comprovanteInput');

                    if (!fileInput.files[0]) {
                        status.innerHTML = '<p style="color:var(--yellow);">Faça upload do comprovante!</p>';
                        return;
                    }

                    btn.disabled = true;
                    btn.textContent = 'Enviando...';
                    status.innerHTML = '';

                    try {
                        const comprovanteBase64 = await imagemParaBase64(fileInput.files[0]);
                        await finalizarCompra(user.uid, userData.username, produto, comprovanteBase64);
                        status.innerHTML = '<p style="color:var(--green);font-weight:600;">✅ Compra realizada! Aguarde aprovação do admin.</p>';
                        btn.textContent = '✓ Enviado';
                        mostrarNotificacao('Compra registrada com sucesso!', 'sucesso');
                    } catch (err) {
                        status.innerHTML = `<p style="color:var(--red);">Erro: ${err.message}</p>`;
                        btn.disabled = false;
                        btn.textContent = '✓ Já paguei - Confirmar Compra';
                    }
                });

            } catch (err) {
                document.getElementById('produtoInfo').innerHTML = `<p style="color:var(--red);">Erro ao carregar: ${err.message}</p>`;
                document.getElementById('pagamentoInfo').innerHTML = '';
                console.error(err);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
