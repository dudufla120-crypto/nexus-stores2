<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Nexus Stores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span>Nexus Stores</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="dashboard.html" style="color:var(--accent);">Meu Perfil</a></li>
            <li><a href="admin.html" id="adminLink" style="display:none;">Painel ADM</a></li>
            <li><a id="logoutBtn" style="cursor:pointer;">Sair</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Meu Perfil</h1>
        <div class="card" style="margin-top:20px;max-width:600px;">
            <div id="profileInfo"><p style="color:#666;">⏳ Carregando...</p></div>
        </div>

        <h2 style="margin-top:40px;">Minhas Compras</h2>
        <div id="minhasCompras" class="card" style="margin-top:16px;">
            <p style="color:#666;">⏳ Carregando...</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase-app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
            "firebase-auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
            "firebase-firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { logout, getCurrentUserData } from './js/auth.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatarPreco, formatarData, mostrarNotificacao } from './js/helper.js';

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            const userData = await getCurrentUserData();
            if (!userData) { window.location.href = 'login.html'; return; }

            const adminBadge = userData.admin
                ? '<span class="status status-aprovado" style="margin-left:8px;">👑 Admin</span>'
                : '';

            document.getElementById('profileInfo').innerHTML = `
                <h3>${userData.username} ${adminBadge}</h3>
                <p style="color:#666;margin-top:8px;">Conta criada em ${userData.dataCadastro ? formatarData(userData.dataCadastro) : '—'}</p>
                <p style="color:#666;margin-top:12px;">Este é seu username único na Nexus Stores.</p>
            `;

            if (userData.admin) {
                document.getElementById('adminLink').style.display = 'inline';
            }

            try {
                const q = query(collection(db, "compras"), orderBy("data", "desc"));

                onSnapshot(q, (snap) => {
                    const uid = user.uid;
                    const minhasCompras = [];
                    snap.forEach(d => {
                        if (d.data().usuario === uid) {
                            minhasCompras.push({ id: d.id, ...d.data() });
                        }
                    });

                    if (minhasCompras.length === 0) {
                        document.getElementById('minhasCompras').innerHTML = '<p style="color:#666;">Você ainda não fez nenhuma compra.</p>';
                        return;
                    }
                    let html = '<div class="admin-table"><table><thead><tr><th>Produto</th><th>Valor</th><th>Data</th><th>Status</th></tr></thead><tbody>';
                    minhasCompras.forEach(c => {
                        const statusClass = c.status === 'aprovado' ? 'status-aprovado' : c.status === 'recusado' ? 'status-recusado' : 'status-pendente';
                        const statusLabel = c.status === 'aprovado' ? 'Aprovado' : c.status === 'recusado' ? 'Recusado' : 'Pendente';
                        html += `<tr><td>${c.produtoNome || '—'}</td><td>${formatarPreco(c.valor)}</td><td>${c.data ? formatarData(c.data) : '—'}</td><td><span class="status ${statusClass}">${statusLabel}</span></td></tr>`;
                    });
                    html += '</tbody></table></div>';
                    document.getElementById('minhasCompras').innerHTML = html;
                }, (err) => {
                    console.error('Erro compras:', err);
                    document.getElementById('minhasCompras').innerHTML = '<p style="color:var(--red);">Erro ao carregar compras.</p>';
                });
            } catch (err) {
                console.error('Erro compras:', err);
                document.getElementById('minhasCompras').innerHTML = '<p style="color:var(--red);">Erro ao carregar compras.</p>';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
