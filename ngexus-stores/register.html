<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Nexus Stores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-center">
                <h1 style="font-size:36px;color:var(--accent);">Nexus Stores</h1>
            </div>
            <h1>Criar Conta</h1>
            <p class="subtitle">Escolha seu username do Roblox</p>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Username Roblox</label>
                    <input type="text" class="form-input" id="username" placeholder="Ex: eduba120" required>
                    <small style="color:var(--text-secondary);font-size:12px;">Seu username será único e não pode ser alterado</small>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" class="form-input" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" class="form-input" id="passwordConfirm" placeholder="Repita a senha" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="registerBtn">
                    Criar Conta
                </button>
            </form>

            <div class="auth-footer">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase-app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
            "firebase-auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
            "firebase-firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { registrar } from './js/auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const form = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const registerBtn = document.getElementById('registerBtn');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            registerBtn.disabled = true;
            registerBtn.textContent = 'Criando conta...';

            try {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const passwordConfirm = document.getElementById('passwordConfirm').value;

                if (!username || !password || !passwordConfirm) {
                    throw new Error('Preencha todos os campos');
                }

                if (password.length < 6) {
                    throw new Error('A senha deve ter no mínimo 6 caracteres');
                }

                if (password !== passwordConfirm) {
                    throw new Error('As senhas não conferem');
                }

                if (username.length < 3) {
                    throw new Error('Username deve ter no mínimo 3 caracteres');
                }

                const result = await registrar(username, password);

                successMsg.textContent = result.isAdmin
                    ? 'Conta criada! Você é ADMIN. Redirecionando...'
                    : 'Conta criada com sucesso! Redirecionando...';
                successMsg.classList.add('show');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                let msg = err.message || 'Erro ao criar conta';
                if (err.code === 'auth/email-already-in-use') {
                    msg = 'Este username já está em uso!';
                }
                errorMsg.textContent = msg;
                errorMsg.classList.add('show');
                registerBtn.disabled = false;
                registerBtn.textContent = 'Criar Conta';
            }
        });
    </script>
</body>
</html>
