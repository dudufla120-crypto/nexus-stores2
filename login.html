<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexus Stores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-center">
                <h1 style="font-size:32px;color:var(--accent);">Nexus Stores</h1>
            </div>
            <h1>Entrar</h1>
            <p class="subtitle">Digite seu username do Roblox</p>
            <div id="errorMsg" style="display:none;background:rgba(239,68,68,0.1);border:1px solid var(--red);color:var(--red);padding:10px;border-radius:8px;margin-bottom:16px;font-size:14px;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username Roblox</label>
                    <input type="text" class="form-input" id="username" placeholder="Ex: eduba120" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" class="form-input" id="password" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">Entrar</button>
            </form>

            <div class="auth-footer">
                Não tem conta? <a href="register.html">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase-app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
            "firebase-auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
            "firebase-firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { login } from './js/auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'dashboard.html';

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                if (!username || !password) throw new Error('Preencha todos os campos');

                await login(username, password);
                window.location.href = redirect;
            } catch (err) {
                let msg = 'Username ou senha incorretos!';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')
                    msg = 'Username ou senha incorretos!';
                else if (err.code === 'auth/invalid-email') msg = 'Username inválido!';
                else if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas! Aguarde um momento.';
                else if (err.message) msg = err.message;

                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
