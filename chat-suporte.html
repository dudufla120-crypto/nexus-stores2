<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Nexus Stores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span>Nexus Stores</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="dashboard.html">Meu Perfil</a></li>
            <li><a id="logoutBtn" style="cursor:pointer;">Sair</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width:700px;">
        <h1>Suporte</h1>
        <div class="card" style="margin-top:16px;">
            <div id="chatMensagens" style="max-height:400px;overflow-y:auto;padding:8px;">
                <p style="color:#666;text-align:center;">Carregando...</p>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;border-top:1px solid #222;padding-top:12px;">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem..." style="flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;">
                <button class="btn btn-primary" id="enviarBtn">Enviar</button>
            </div>
        </div>
        <div id="statusConexao" style="margin-top:8px;font-size:13px;color:#666;text-align:center;"></div>
        <a href="dashboard.html" class="btn btn-secondary" style="margin-top:12px;display:inline-block;">Voltar</a>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase-app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
            "firebase-auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
            "firebase-firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1IFV10wUyzo_gX2hnvXCgARyXanN_5Zg",
            authDomain: "nexus-stores.firebaseapp.com",
            projectId: "nexus-stores",
            storageBucket: "nexus-stores.firebasestorage.app",
            messagingSenderId: "68773888286",
            appId: "1:68773888286:web:2f72c4debc72bf2576c90f"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function scrollParaBaixo() {
            const el = document.getElementById('chatMensagens');
            requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
        }

        function formatarDataChat(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            const userSnap = await getDoc(doc(db, "usuarios", user.uid));
            const userData = userSnap.data() || {};
            const chatId = user.uid;
            const chatRef = doc(db, "chats_suporte", chatId);

            const statusEl = document.getElementById('statusConexao');
            statusEl.textContent = 'Conectado ao suporte...';

            try {
                await setDoc(chatRef, { usuario: user.uid, username: userData.username || 'Usuario', ultimaAtividade: new Date().toISOString() }, { merge: true });
            } catch (e) { console.error(e); }

            onSnapshot(chatRef, (snap) => {
                const data = snap.data() || {};
                const msgs = data.mensagens || [];
                const el = document.getElementById('chatMensagens');

                if (msgs.length === 0) {
                    el.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">Nenhuma mensagem ainda. Envie uma mensagem para o suporte!</p>';
                    return;
                }

                el.innerHTML = msgs.map(m => {
                    const ehAdmin = m.remetente === 'admin';
                    return `<div style="display:flex;flex-direction:column;align-items:${ehAdmin ? 'flex-start' : 'flex-end'};margin-bottom:10px;">
                        <div style="background:${ehAdmin ? '#1a1a2e' : '#7c3aed'};color:#fff;padding:8px 14px;border-radius:${ehAdmin ? '4px 16px 16px 16px' : '16px 4px 16px 16px'};max-width:80%;word-wrap:break-word;">
                            <div style="font-size:13px;">${m.texto}</div>
                            <div style="font-size:10px;color:${ehAdmin ? '#888' : '#c4b5fd'};margin-top:4px;">${formatarDataChat(m.data)}${ehAdmin ? ' • Suporte' : ''}</div>
                        </div>
                    </div>`;
                }).join('');
                scrollParaBaixo();
            });

            document.getElementById('enviarBtn').addEventListener('click', () => enviarMensagem(chatRef));
            document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarMensagem(chatRef); });
        });

        async function enviarMensagem(chatRef) {
            const input = document.getElementById('chatInput');
            const texto = input.value.trim();
            if (!texto) return;
            input.value = '';
            try {
                await setDoc(chatRef, {
                    mensagens: arrayUnion({ remetente: 'usuario', texto, data: new Date().toISOString() }),
                    ultimaAtividade: new Date().toISOString()
                }, { merge: true });
            } catch (err) { console.error(err); }
        }

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
