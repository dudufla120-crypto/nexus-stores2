<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Nexus Stores</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo-center">
                <h1 style="font-size:32px;color:var(--accent);">Nexus Stores</h1>
            </div>
            <h1>Criar Conta</h1>
            <p class="subtitle">Escolha seu username do Roblox (único)</p>
            <div id="errorMsg" style="display:none;background:rgba(239,68,68,0.1);border:1px solid var(--red);color:var(--red);padding:10px;border-radius:8px;margin-bottom:16px;font-size:14px;"></div>
            <div id="successMsg" style="display:none;background:rgba(16,185,129,0.1);border:1px solid var(--green);color:var(--green);padding:10px;border-radius:8px;margin-bottom:16px;font-size:14px;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Username Roblox</label>
                    <input type="text" class="form-input" id="username" placeholder="Ex: eduba120" required>
                    <small style="color:#555;font-size:12px;">Username único - não pode ser alterado depois</small>
                </div>
                <div class="form-group">
                    <label>Senha (mínimo 6 caracteres)</label>
                    <input type="password" class="form-input" id="password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Senha</label>
                    <input type="password" class="form-input" id="passwordConfirm" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="registerBtn">Criar Conta</button>
            </form>

            <div class="auth-footer">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase-app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
            "firebase-auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
            "firebase-firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js"
        }
    }
    </script>
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { registrar } from './js/auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'dashboard.html';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const btn = document.getElementById('registerBtn');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Criando conta...';

            try {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const passwordConfirm = document.getElementById('passwordConfirm').value;

                if (!username || !password) throw new Error('Preencha todos os campos');
                if (username.length < 3) throw new Error('Username deve ter no mínimo 3 caracteres');
                if (password.length < 6) throw new Error('Senha deve ter no mínimo 6 caracteres');
                if (password !== passwordConfirm) throw new Error('Senhas não conferem');

                const result = await registrar(username, password);

                successMsg.textContent = result.isAdmin
                    ? '👑 Conta ADMIN criada! Redirecionando...'
                    : 'Conta criada! Redirecionando...';
                successMsg.style.display = 'block';

                setTimeout(() => window.location.href = 'dashboard.html', 1500);

            } catch (err) {
                let msg = err.message || 'Erro ao criar conta';
                if (err.code === 'auth/email-already-in-use') msg = 'Este username já está em uso!';
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Criar Conta';
            }
        });
    </script>
</body>
</html>
